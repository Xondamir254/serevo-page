<!doctype html>
<html lang="en" data-mode="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset Password — Serevo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400;1,500&family=Outfit:wght@200;300;400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      :root[data-mode="dark"] {
        --bg: #0f172a;
        --card: #1e293b;
        --text: #f1f5f9;
        --muted: #94a3b8;
        --border: #334155;
        --accent: #6ee7b7;
        --accentSoft: #064e3b;
        --negative: #ef4444;
        --border-rgb: 51, 65, 85;
        --accent-rgb: 110, 231, 183;
      }

      html,
      body {
        height: 100%;
      }
      body {
        font-family: "Outfit", sans-serif;
        background: var(--bg);
        color: var(--text);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        position: relative;
        overflow: hidden;
      }

      .noise {
        position: fixed;
        inset: 0;
        z-index: 0;
        opacity: 0.025;
        pointer-events: none;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
        background-size: 200px 200px;
      }

      .card {
        position: relative;
        z-index: 1;
        width: 100%;
        max-width: 440px;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 20px;
        padding: 3rem 2.5rem;
        text-align: center;
      }

      .logo {
        font-family: "Playfair Display", serif;
        font-size: 1.3rem;
        color: var(--accent);
        letter-spacing: 0.06em;
        margin-bottom: 2rem;
      }

      .orb-wrap {
        width: 96px;
        height: 96px;
        margin: 0 auto 2rem;
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .orb-ring {
        position: absolute;
        border-radius: 50%;
        border: 1px solid rgba(var(--accent-rgb), 0.18);
        animation: orbRotate 8s linear infinite;
      }
      .orb-ring:nth-child(1) {
        width: 100%;
        height: 100%;
      }
      .orb-ring:nth-child(2) {
        width: 72%;
        height: 72%;
        border-color: rgba(var(--accent-rgb), 0.3);
        animation-direction: reverse;
        animation-duration: 6s;
      }
      @keyframes orbRotate {
        from {
          transform: rotate(0);
        }
        to {
          transform: rotate(360deg);
        }
      }
      .orb-core {
        width: 52px;
        height: 52px;
        border-radius: 50%;
        background: var(--accentSoft);
        border: 1px solid rgba(var(--accent-rgb), 0.35);
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        z-index: 2;
      }
      .orb-core svg {
        width: 22px;
        height: 22px;
        stroke: var(--accent);
        fill: none;
        stroke-width: 1.6;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      h1 {
        font-family: "Playfair Display", serif;
        font-weight: 400;
        font-size: 1.5rem;
        margin-bottom: 0.75rem;
      }
      h1 em {
        color: var(--accent);
        font-style: italic;
      }

      p.desc {
        font-size: 0.9rem;
        font-weight: 300;
        color: var(--muted);
        line-height: 1.8;
        margin-bottom: 2rem;
      }

      .btn-primary {
        display: inline-flex;
        align-items: center;
        gap: 0.6rem;
        padding: 0.85rem 1.75rem;
        background: var(--accent);
        border-radius: 50px;
        color: var(--bg);
        font-size: 0.85rem;
        font-weight: 500;
        text-decoration: none;
        letter-spacing: 0.04em;
        transition: all 0.3s;
      }
      .btn-primary:hover {
        opacity: 0.88;
        transform: translateY(-2px);
      }

      .status {
        margin-top: 1.75rem;
        font-size: 0.78rem;
        font-weight: 300;
        color: var(--muted);
        letter-spacing: 0.02em;
      }
      .status.error {
        color: var(--negative);
      }

      .spinner {
        width: 16px;
        height: 16px;
        border-radius: 50%;
        border: 2px solid rgba(var(--accent-rgb), 0.25);
        border-top-color: var(--accent);
        display: inline-block;
        animation: spin 0.8s linear infinite;
        margin-right: 0.5rem;
        vertical-align: -3px;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      @media (max-width: 480px) {
        .card {
          padding: 2.5rem 1.75rem;
        }
      }
    </style>
  </head>
  <body>
    <div class="noise"></div>

    <div class="card">
      <div class="logo">Serevo</div>

      <div class="orb-wrap">
        <div class="orb-ring"></div>
        <div class="orb-ring"></div>
        <div class="orb-core">
          <svg viewBox="0 0 24 24">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />
          </svg>
        </div>
      </div>

      <h1 id="title">Opening <em>Serevo</em>…</h1>
      <p class="desc" id="desc">
        Taking you back to the app to finish resetting your password.
      </p>

      <a href="#" id="openBtn" class="btn-primary" style="display: none">
        Open Serevo
      </a>

      <p class="status" id="status">
        <span class="spinner"></span>Redirecting…
      </p>
    </div>

    <script>
      // Supabase attaches the session token either as a query string
      // (?access_token=...) or, more commonly for recovery links, as a
      // URL fragment (#access_token=...&type=recovery). We need to
      // forward BOTH through to the app's custom scheme, since a plain
      // fragment on window.location.href would otherwise be dropped
      // when we build the new serevo:// URL from scratch.
      const search = window.location.search; // "?a=1&b=2" or ""
      const hash = window.location.hash; // "#a=1&b=2" or ""

      let appLink = "serevo://reset-password";
      if (search) {
        appLink += search;
      }
      if (hash) {
        // Turn "#access_token=x&type=recovery" into query-string form
        // so the app can read it consistently regardless of how it
        // parses the incoming deep link.
        const hashParams = hash.substring(1); // strip leading "#"
        appLink += (search ? "&" : "?") + hashParams;
      }

      const titleEl = document.getElementById("title");
      const descEl = document.getElementById("desc");
      const statusEl = document.getElementById("status");
      const btn = document.getElementById("openBtn");

      btn.href = appLink;

      let opened = false;
      window.addEventListener("blur", () => {
        opened = true;
      });

      // Attempt automatic redirect
      window.location.href = appLink;

      // If the app didn't open within ~1.5s (still on this page,
      // most likely no app installed / desktop browser), show a
      // manual button + friendlier message instead of stalling.
      setTimeout(() => {
        if (opened || document.hidden) return;

        titleEl.innerHTML = "Continue in <em>Serevo</em>";
        descEl.textContent =
          "Tap below to open the app and finish resetting your password.";
        statusEl.style.display = "none";
        btn.style.display = "inline-flex";
      }, 1500);
    </script>
  </body>
</html>
